<style>
  /* ============ TOKENS ============ */
  :root{
    --canvas:#eef1ef;
    --surface:#ffffff;
    --surface-2:#f5f7f5;
    --ink:#141a19;
    --ink-soft:#4d5b58;
    --ink-faint:#7c8a86;
    --line:#d9e0dc;
    --line-strong:#c2cbc6;
    --accent:#1f6f6b;
    --accent-ink:#ffffff;
    --accent-soft:#e2f0ee;
    --accent-soft-line:#bcdcd8;
    --moss:#3f7d4a;
    --moss-soft:#e5f1e6;
    --amber:#a3711c;
    --amber-soft:#f7ecd8;
    --rose:#b5423a;
    --rose-soft:#f8e6e3;
    --shadow:0 1px 2px rgba(20,26,25,.06), 0 6px 20px -12px rgba(20,26,25,.18);
    --radius:10px;
    --sidebar-w:272px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#121716;
      --surface:#1a201f;
      --surface-2:#1f2625;
      --ink:#e8ece9;
      --ink-soft:#a9b5b0;
      --ink-faint:#78857f;
      --line:#2b3432;
      --line-strong:#3a453f;
      --accent:#57bab2;
      --accent-ink:#08211f;
      --accent-soft:#1c2f2d;
      --accent-soft-line:#2c4644;
      --moss:#6fbf7c;
      --moss-soft:#1c2b1f;
      --amber:#dba64b;
      --amber-soft:#332a19;
      --rose:#e0847c;
      --rose-soft:#332120;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#121716;
    --surface:#1a201f;
    --surface-2:#1f2625;
    --ink:#e8ece9;
    --ink-soft:#a9b5b0;
    --ink-faint:#78857f;
    --line:#2b3432;
    --line-strong:#3a453f;
    --accent:#57bab2;
    --accent-ink:#08211f;
    --accent-soft:#1c2f2d;
    --accent-soft-line:#2c4644;
    --moss:#6fbf7c;
    --moss-soft:#1c2b1f;
    --amber:#dba64b;
    --amber-soft:#332a19;
    --rose:#e0847c;
    --rose-soft:#332120;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; font-size:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ============ SHELL ============ */
  .shell{display:flex; min-height:100%;}

  .sidebar{
    width:var(--sidebar-w); flex:none;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 20px 16px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:8px;
    background:var(--ink); color:var(--canvas);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; font-size:13px; letter-spacing:.02em;
    flex:none;
  }
  .brand-text strong{display:block; font-size:14.5px; font-weight:600;}
  .brand-text span{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:1px;}

  .mode-switch{
    margin:2px 16px 14px; padding:3px;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; display:flex; gap:2px;
  }
  .mode-switch button{
    flex:1; border:0; background:transparent; color:var(--ink-soft);
    padding:7px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; font-weight:500;
    transition:background .15s, color .15s;
  }
  .mode-switch button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  .nav-scroll{flex:1; overflow-y:auto; padding:4px 12px 16px;}
  .nav-group{margin-top:16px;}
  .nav-group:first-child{margin-top:2px;}
  .nav-group-label{
    font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); padding:0 10px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:8px 10px; margin-bottom:1px;
    background:transparent; border:0; border-radius:7px;
    color:var(--ink-soft); cursor:pointer; text-align:left; font-size:13.3px; font-weight:500;
    transition:background .12s, color .12s;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent);}
  .nav-item .ic{width:16px; height:16px; flex:none; opacity:.85;}
  .nav-item .count{
    margin-left:auto; font-family:'IBM Plex Mono'; font-size:11px;
    color:var(--ink-faint); background:var(--surface-2); border:1px solid var(--line);
    padding:1px 6px; border-radius:20px;
  }
  .nav-item.active .count{color:var(--accent); background:var(--surface); border-color:var(--accent-soft-line);}

  .sidebar-foot{
    border-top:1px solid var(--line); padding:12px 16px 16px;
    display:flex; align-items:center; gap:9px;
  }
  .foot-avatar{
    width:30px; height:30px; border-radius:50%; flex:none;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px;
  }
  .foot-text strong{display:block; font-size:12.8px;}
  .foot-text span{display:block; font-size:11px; color:var(--ink-faint);}

  /* ============ MAIN ============ */
  .main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}

  .topbar{
    flex:none; display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:22px 32px 18px; border-bottom:1px solid var(--line); background:var(--canvas);
  }
  .topbar .eyebrow{font-size:11.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px;}
  .topbar h1{font-size:22px;}
  .topbar p{margin:5px 0 0; color:var(--ink-soft); font-size:13.3px; max-width:56ch;}
  .topbar-actions{display:flex; gap:8px; flex:none; padding-top:2px;}

  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:7px; border:1px solid transparent;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:filter .12s, background .12s;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:5px 10px; font-size:12.3px; border-radius:6px;}
  .btn-quiet{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn-quiet:hover{background:var(--surface-2); color:var(--ink);}

  .page-scroll{flex:1; overflow-y:auto;}
  .page{max-width:1180px; margin:0 auto; padding:26px 32px 64px; display:flex; flex-direction:column; gap:26px;}

  /* ============ TABS ============ */
  .tabbar{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:-1px;}
  .tab{
    background:transparent; border:0; border-bottom:2px solid transparent;
    padding:10px 4px; margin-right:22px; color:var(--ink-faint); font-weight:600; font-size:13.3px;
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .tab:hover{color:var(--ink-soft);}
  .tab.active{color:var(--ink); border-bottom-color:var(--accent);}
  .tab .badge{
    font-family:'IBM Plex Mono'; font-size:11px; background:var(--surface-2); color:var(--ink-faint);
    border:1px solid var(--line); padding:0 6px; border-radius:20px; line-height:1.6;
  }
  .tab.active .badge{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft-line);}
  .tab.attn .badge{background:var(--amber-soft); color:var(--amber); border-color:transparent;}

  /* ============ PRIMITIVES ============ */
  .section{display:flex; flex-direction:column; gap:12px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .section-head h2{font-size:15.5px;}
  .section-head p{margin:2px 0 0; font-size:12.6px; color:var(--ink-faint);}
  .section-head .link{font-size:12.6px; font-weight:600; color:var(--accent); background:none; border:0; cursor:pointer;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .stat .k{font-size:11.8px; color:var(--ink-faint); font-weight:600;}
  .stat .v{font-family:'IBM Plex Mono'; font-size:25px; font-weight:600; letter-spacing:-.01em;}
  .stat .d{font-size:11.6px; color:var(--ink-faint); display:flex; align-items:center; gap:5px;}
  .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .dot.moss{background:var(--moss);} .dot.amber{background:var(--amber);} .dot.rose{background:var(--rose);} .dot.ink{background:var(--ink-faint);}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .panel-pad{padding:16px 18px;}

  .list{display:flex; flex-direction:column;}
  .list-row{
    display:flex; align-items:center; gap:14px; padding:13px 18px; border-bottom:1px solid var(--line);
  }
  .list-row:last-child{border-bottom:0;}
  .list-row .who{width:30px;height:30px;border-radius:50%;flex:none;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11.5px;color:var(--ink-soft);}
  .list-row .main{flex:1; min-width:0;}
  .list-row .main .t1{font-size:13.3px; font-weight:600;}
  .list-row .main .t2{font-size:12.3px; color:var(--ink-faint); margin-top:1px;}
  .list-row .t1 span{font-weight:500; color:var(--ink-soft);}
  .list-row .side{flex:none; display:flex; align-items:center; gap:8px;}

  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-faint); padding:10px 18px; border-bottom:1px solid var(--line); background:var(--surface-2);
  }
  td{padding:12px 18px; border-bottom:1px solid var(--line); font-size:13.2px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono';}
  .cell-primary{font-weight:600;}
  .cell-sub{font-size:11.8px; color:var(--ink-faint); margin-top:1px;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.3px; font-weight:600;
    padding:3px 9px 3px 7px; border-radius:20px; white-space:nowrap;
  }
  .pill.moss{background:var(--moss-soft); color:var(--moss);}
  .pill.amber{background:var(--amber-soft); color:var(--amber);}
  .pill.rose{background:var(--rose-soft); color:var(--rose);}
  .pill.ink{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);}
  .pill .dot{width:5px; height:5px;}

  .role-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .role-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .role-card .rtag{font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
  .role-card h3{font-size:15px;}
  .role-card p{margin:0; font-size:12.6px; color:var(--ink-soft); flex:1;}
  .role-card .rfoot{display:flex; align-items:center; justify-content:space-between; padding-top:6px; border-top:1px solid var(--line);}
  .role-card .rfoot .cost{font-family:'IBM Plex Mono'; font-size:12.6px; color:var(--ink-faint);}

  .empty{padding:32px 18px; text-align:center; color:var(--ink-faint); font-size:13px;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}

  .field-note{
    display:flex; gap:10px; align-items:flex-start; background:var(--accent-soft); border:1px solid var(--accent-soft-line);
    border-radius:var(--radius); padding:12px 14px; font-size:12.6px; color:var(--ink-soft);
  }
  .field-note strong{color:var(--ink);}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:0;}
  .toggle-row .t1{font-size:13.2px; font-weight:600;}
  .toggle-row .t2{font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .switch{width:36px; height:20px; border-radius:20px; background:var(--line-strong); position:relative; cursor:pointer; flex:none; border:0;}
  .switch.on{background:var(--accent);}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--surface); transition:left .15s;}
  .switch.on::after{left:18px;}

  .kv-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0;}
  .kv{padding:13px 18px; border-bottom:1px solid var(--line); border-right:1px solid var(--line);}
  .kv:nth-child(2n){border-right:0;}
  .kv .k{font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .kv .v{font-size:13.4px; margin-top:3px; font-weight:500;}

  .scope-banner{
    display:flex; gap:11px; align-items:flex-start; background:var(--surface-2); border:1px dashed var(--line-strong);
    border-radius:var(--radius); padding:14px 16px; font-size:12.6px; color:var(--ink-soft); margin-bottom:4px;
  }
  .scope-banner strong{color:var(--ink); display:block; margin-bottom:2px; font-size:13px;}

  @media (max-width: 860px){
    .sidebar{position:fixed; z-index:20; transform:translateX(-100%); transition:transform .18s;}
    .sidebar.open{transform:translateX(0);}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .role-grid{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .kv-grid{grid-template-columns:1fr;}
    .kv{border-right:0;}
    .page{padding:20px 16px 48px;}
    .topbar{padding:16px;}
  }
</style>

/* ---------------------------------------------------------------
   RENDER HELPERS
--------------------------------------------------------------- */
function pill(kind, text){
  const dotClass = {moss:'moss', amber:'amber', rose:'rose', ink:'ink'}[kind] || 'ink';
  return `<span class="pill ${kind}"><span class="dot ${dotClass}"></span>${text}</span>`;
}
function statusPill(status){
  const map = {
    active:['moss','Active'], paused:['ink','Paused'], prospect:['amber','Prospect'],
    sent:['amber','Sent'], paid:['moss','Paid'], overdue:['rose','Overdue'], draft:['ink','Draft'],
    won:['moss','Won'], ontrack:['moss','On track'], attn:['amber','Needs attention'], done:['ink','Delivered'],
    pending:['amber','Pending'], accepted:['moss','Accepted'], approved:['moss','Approved'], blocked:['rose','Blocked'],
    ok:['moss','Operational'], 'sent-back':['rose','Sent back'], deployed:['moss','Deployed'], planned:['ink','Planned'],
    completed:['moss','Completed'], open:['rose','Open'], resolved:['moss','Resolved'],
  };
  const pair = map[status] || ['ink', status];
  return pill(pair[0], pair[1]);
}
function initials(name){ return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

function tabBar(pageId, tabs){
  return '<div class="tabbar">' + tabs.map(function(t){
    return '<button class="tab ' + (state.tabs[pageId]===t.id?'active':'') + ' ' + (t.attn?'attn':'') + '" onclick="setTab(\'' + pageId + '\',\'' + t.id + '\')">' +
      t.label + (t.count!==undefined?'<span class="badge">'+t.count+'</span>':'') +
      '</button>';
  }).join('') + '</div>';
}
function setTab(pageId, tabId){ state.tabs[pageId] = tabId; renderPage(); }
function setMode(mode){
  state.mode = mode; state.page = mode==='owner' ? 'dashboard' : 'admin-firms';
  document.getElementById('modeOwnerBtn').classList.toggle('active', mode==='owner');
  document.getElementById('modeAdminBtn').classList.toggle('active', mode==='admin');
  renderNav(); renderPage();
}
function setPage(id){ state.page = id; renderNav(); renderPage(); document.querySelector('.page-scroll').scrollTop = 0; }

function renderNav(){
  const groups = state.mode==='owner' ? OWNER_NAV : ADMIN_NAV;
  document.getElementById('navScroll').innerHTML = groups.map(function(g){
    return '<div class="nav-group"><div class="nav-group-label">' + g.label + '</div>' +
      g.items.map(function(it){
        const count = it.count ? (typeof it.count==='function'?it.count():it.count) : null;
        return '<button class="nav-item ' + (state.page===it.id?'active':'') + '" onclick="setPage(\'' + it.id + '\')">' +
          ICONS[it.icon] + '<span>' + it.label + '</span>' +
          (count!==null?'<span class="count">'+count+'</span>':'') +
          '</button>';
      }).join('') + '</div>';
  }).join('');
}

function renderPage(){
  const meta = PAGE_META[state.page];
  if(meta){

    document.getElementById('pageTitle').textContent = meta.title;
    document.getElementById('pageDesc').textContent = meta.desc;
  }
  let actions = '';
  if(state.page==='dashboard') actions = '<button class="btn btn-ghost">Refresh</button>';
  else if(state.page==='team') actions = '<button class="btn btn-primary" onclick="setTab(\'team\',\'hire\')">+ Hire a worker</button>';
  else if(state.page==='sales') actions = '<button class="btn btn-primary">+ New proposal</button>';
  else if(state.page==='finance') actions = '<button class="btn btn-primary" onclick="setTab(\'finance\',\'invoices\')">+ New invoice</button>';

  else if(state.page==='admin-audit') actions = '<button class="btn btn-ghost">Export evidence bundle</button>';
  document.getElementById('pageActions').innerHTML = actions;
  const fn = PAGES[state.page];
  document.getElementById('pageBody').innerHTML = fn ? fn() : '<div class="panel"><div class="empty">Unknown page.</div></div>';
}
